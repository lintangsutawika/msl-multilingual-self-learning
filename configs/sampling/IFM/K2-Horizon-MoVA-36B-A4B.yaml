# mini-swe-agent sampling for IFM/K2-Horizon-MoVA-36B-A4B (self-hosted vLLM).
#
# Selected automatically by harbor_eval.sh from MODEL: harbor/configs/<repo>.yaml.
#
# K2-Horizon is a REASONING + tool-use model. Evaluation best practices:
#   * reasoning_effort = "high" ALWAYS.
#   * temperature 1.0, top_p 0.95, allow >= 32768 max_tokens.
#   * tool calls in xml/json/xml_typed (default xml), parsed by k2_horizon parser.
# reasoning_effort + tool_call_format ride in extra_body.chat_template_kwargs.
#
# SERVING (configs/serve/IFM/K2-Horizon-MoVA-36B-A4B.json): TP=2 +
# --enable-expert-parallel (MoE), --trust-remote-code, k2_horizon parsers.
# Non-FP8 (BF16) weights, so --dtype bfloat16 is fine. Wrong tool parser silently
# zeroes the eval (memory: vllm-tool-parser-gotcha).
model:
  model_kwargs:
    max_tokens: 32768
    timeout: 1200
    temperature: 1.0
    top_p: 0.95
    drop_params: true
    extra_body:
      chat_template_kwargs:
        reasoning_effort: high
        tool_call_format: xml