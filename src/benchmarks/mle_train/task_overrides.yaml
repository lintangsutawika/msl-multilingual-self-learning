# Per-task fixes the automatic checks can't make, found by the Qwen3.5-9B baseline sweep (2026-11-09) and the audit
# that followed. `split` applies them; a rebuild keeps them.

# Columns MLE-Dojo left in the public test.csv that hold the test answers. They are dropped from test.csv before the
# split (Kaggle's own test file never had them).
drop_test_columns:
  bigquery-geotab-intersection-congestion:   # all 15 targets, wide format (answers are RowId_k rows)
    [TotalTimeStopped_p20, TotalTimeStopped_p40, TotalTimeStopped_p50, TotalTimeStopped_p60, TotalTimeStopped_p80,
     TimeFromFirstStop_p20, TimeFromFirstStop_p40, TimeFromFirstStop_p50, TimeFromFirstStop_p60, TimeFromFirstStop_p80,
     DistanceToFirstStop_p20, DistanceToFirstStop_p40, DistanceToFirstStop_p50, DistanceToFirstStop_p60,
     DistanceToFirstStop_p80]
  quora-question-pairs: [is_duplicate]
  bnp-paribas-cardif-claims-management: [target]

# Tasks whose Kaggle leaderboard measures a different problem, so the leaderboard reward (position, medal) is
# meaningless: a trivial baseline beats Kaggle's winner.
exclude:
  allstate-purchase-prediction-challenge: >-
    test histories are easier than Kaggle's (the last-quoted-plan baseline scores 69% vs Kaggle's best 53.7%), and
    the metric is a percentage while the leaderboard is a fraction
  # Forecasting competitions (Kaggle's test is the future) that MLE-Dojo/DSBench split at random over dates: every
  # test day lies inside the training period, so interpolating beats forecasting. For covid the nearest-day baseline
  # wins gold (error 0.14-0.21 vs Kaggle's best 0.43-0.72).
  covid19-global-forecasting-week-2: &forecast >-
    forecasting competition split at random over dates: test days lie inside the training period, so the Kaggle
    leaderboard (true forecasting) is not comparable
  covid19-global-forecasting-week-3: *forecast
  covid19-global-forecasting-week-4: *forecast
  bike-sharing-demand: *forecast
  demand-forecasting-kernels-only: *forecast
  playground-series-s3e19: *forecast
  playground-series-s3e20: *forecast
  rossmann-store-sales: *forecast
  tabular-playground-series-jan-2022: *forecast
  tabular-playground-series-mar-2022: *forecast
  tabular-playground-series-sep-2022: *forecast
  walmart-recruiting-store-sales-forecasting: *forecast
