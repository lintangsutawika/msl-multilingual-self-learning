# Per-task fixes the automatic checks can't make, found by the Qwen3.5-9B baseline sweep (2026-11-09) and the audit
# that followed. `split` applies them; a rebuild keeps them.

# Columns MLE-Dojo left in the public test.csv that hold the test answers. They are dropped from test.csv before the
# split (Kaggle's own test file never had them).
drop_test_columns:
  bigquery-geotab-intersection-congestion:   # all 15 targets, wide format (answers are RowId_k rows)
    [TotalTimeStopped_p20, TotalTimeStopped_p40, TotalTimeStopped_p50, TotalTimeStopped_p60, TotalTimeStopped_p80,
     TimeFromFirstStop_p20, TimeFromFirstStop_p40, TimeFromFirstStop_p50, TimeFromFirstStop_p60, TimeFromFirstStop_p80,
     DistanceToFirstStop_p20, DistanceToFirstStop_p40, DistanceToFirstStop_p50, DistanceToFirstStop_p60,
     DistanceToFirstStop_p80]
  quora-question-pairs: [is_duplicate]
  bnp-paribas-cardif-claims-management: [target]

# Tasks left out entirely (task: reason). These 7 have no comparable Kaggle leaderboard, so their final grade could
# carry no medal; dropped on 2026-11-11 to keep every training task's final reward medal-based.
exclude:
  allstate-purchase-prediction-challenge: >-
    test histories are easier than Kaggle's (the last-quoted-plan baseline scores 69% vs Kaggle's best 53.7%), and
    the metric is a percentage while the leaderboard is a fraction
  shopee-product-matching: >-
    the sample submission (each posting matches only itself) already beats every Kaggle team: F1 over matching
    groups depends on the size of the test set, which is far smaller than Kaggle's
  yelp-recsys-2013: >-
    the sample submission already beats 86% of Kaggle teams: Kaggle's test was built around cold-start users and
    businesses, our random split is not
  bigquery-geotab-intersection-congestion: >-
    two of the baseline sweep's trials beat Kaggle's best by 13-17% with 2-3 validate calls: 98% of test
    intersections are also in train under MLE-Dojo's random split
  playground-series-s3e6: >-
    two independent baseline trials beat Kaggle's best RMSE by 15%: our test half lacks the extreme-price outliers
    that dominate Kaggle's RMSE
  covid19-global-forecasting-week-1: >-
    after the time re-split, repeating each series' last value still beats 90% of Kaggle teams, so our held-out
    period is not comparable to Kaggle's test period
  playground-series-s3e19: >-
    after the time re-split, repeating each series' last value beats 78% of Kaggle teams, so our held-out year is
    not comparable to Kaggle's test year

# Tasks kept for training without a Kaggle leaderboard (normalized score, no medal). Empty: see exclude.
no_leaderboard:
  {}

# Sample submissions MLE-Dojo filled with the true answers: their target columns are reset to Kaggle's placeholder.
sample_constant:
  ashrae-energy-prediction: {meter_reading: 0}
  bioresponse: {Activity: 0.5}

# Per-task ceiling for the sample submission's leaderboard position (default MAX_SAMPLE_POSITION in split.py), where
# the leaderboard is genuinely weak rather than not comparable.
max_sample_position:
  loan-default-prediction: 0.7  # predicting all zeros beat 62% of Kaggle teams on Kaggle too (MAE, mostly zeros)

# Forecasting competitions (Kaggle's test is the future) that MLE-Dojo/DSBench split at random over dates: every test
# day lay inside the training period, so interpolation beat Kaggle's forecasters (covid: the nearest-day baseline won
# gold). timesplit.py merges train + test back and holds out the LAST stretch of time instead. See timesplit.py.
time_split:
  covid19-global-forecasting-week-1: {time: Date, series: [Country/Region, Province/State]}
  covid19-global-forecasting-week-2: {time: Date, series: [Country_Region, Province_State]}
  covid19-global-forecasting-week-3: {time: Date, series: [Country_Region, Province_State]}
  covid19-global-forecasting-week-4: {time: Date, series: [Country_Region, Province_State]}
  bike-sharing-demand: {time: datetime, month_days: 4}  # Kaggle's test: days 20+ of each month; we have days 1-19
  demand-forecasting-kernels-only: {time: date, series: [store, item]}
  playground-series-s3e19: {time: date, series: [country, store, product]}
  playground-series-s3e20: {time: [year, week_no], series: [latitude, longitude]}
  rossmann-store-sales: {time: Date, series: [Store], id_from: row, drop_test: [Customers]}  # Kaggle's test had no Customers
  tabular-playground-series-jan-2022: {time: date, series: [country, store, product]}
  tabular-playground-series-mar-2022: {time: time, series: [x, y, direction]}
  tabular-playground-series-sep-2022: {time: date, series: [country, store, product]}
  walmart-recruiting-store-sales-forecasting: {time: Date, series: [Store, Dept], id_from: [Store, Dept, Date]}
