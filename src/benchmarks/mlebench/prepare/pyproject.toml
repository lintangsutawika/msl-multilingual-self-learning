# MLE-bench preparation environment: downloading MLE-bench, the validation split and building tasks (and the host-side
# validate grader on Babel), apart from the repo's .venv, which runs the evaluation (Harbor, agents).
#
#   uv run --project src/benchmarks/mlebench/prepare python -m <module> ...
#
# Why a separate environment: the repo's .venv has pandas 3, and several of MLE-bench's prepare.py scripts break under
# it (`.unique()` returns an ArrowStringArray that train_test_split rejects). Here MLE-bench is pinned to the same
# revision as the repo (pyproject.toml), with pandas<3, so scores match those of the grader in the task image.
[project]
name = "mlebench-prepare"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlebench",
    "pandas>=2.2,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
mlebench = { git = "https://github.com/openai/mle-bench.git", rev = "507f92e1138bb6e40dac5c6ee7a6758e6424bf97" }

# MLE-bench's declared dependencies pull TensorFlow, Docker, OpenAI and Jupyter, which none of its prepare or grading
# code imports. This replaces them with what it does import (the task image installs it with --no-deps and the same
# list), plus kaggle (<1.7, as MLE-bench requires) for downloading from Kaggle.
[[tool.uv.dependency-metadata]]
name = "mlebench"
version = "1.0.0"
requires-dist = [
    "appdirs", "diskcache", "kaggle>=1.6,<1.7", "levenshtein", "numpy", "pandas>=2.2", "pillow", "py7zr",
    "pycocotools", "pymongo", "pyquaternion", "pyyaml", "requests", "scikit-learn", "scipy", "shapely", "tenacity",
    "tqdm",
]
