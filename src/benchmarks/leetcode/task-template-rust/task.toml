schema_version = "1.0"
[task]
name = "leetcode/{question_id}-{language}"
keywords = ["leetcode", "{language}", "coding"]
[metadata]
question_id = {question_id}
language = "{language}"
dataset = "leetcode-multilingual"
[verifier]
timeout_sec = 300
[agent]
timeout_sec = 300
[environment]
build_timeout_sec = 900
cpus = 1
memory_mb = 8192
docker_image = "{docker_image}"
